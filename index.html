<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
      
      /* Start Overlay to unlock audio/camera */
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center;
      }
      #start-btn {
        padding: 15px 40px; font-size: 20px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 30px;
        color: black; font-weight: bold; margin-top: 20px;
        box-shadow: 0 0 20px #00ffff;
      }

      #ui-overlay {
        position: absolute; bottom: 30px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none; /* Hidden until started */
      }
      .instruction {
        background: rgba(0,0,0,0.8); color: white;
        padding: 12px 25px; border-radius: 50px;
        display: inline-block; transition: all 0.3s ease;
        border: 1px solid #444;
      }
      .scanning .instruction {
        border-color: #00ffff; box-shadow: 0 0 15px #00ffff;
        color: #00ffff;
      }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1>GHOST HUNTER AR</h1>
      <p>Ensure your sound is on for the full experience.</p>
      <button id="start-btn">BEGIN SEARCH</button>
    </div>

    <div id="ui-overlay">
      <div class="instruction">Scanning for spirits...</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Realistic 3D Ghost Model (GLB) -->
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
        <!-- Spooky Ambient Sound -->
        <audio id="ghostSound" src="https://cdn.pixabay.com/audio/2022/10/30/audio_55a2998782.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- The Ghost Model -->
        <a-entity id="ghost-group" class="clickable">
          <a-gltf-model 
            id="ghost-mesh"
            src="#ghostModel" 
            position="0 -0.5 0" 
            rotation="0 0 0" 
            scale="0.5 0.5 0.5"
            animation="property: position; to: 0 -0.4 0.1; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
          ></a-gltf-model>

          <!-- Ethereal Glow surrounding the ghost -->
          <a-light type="point" intensity="1.5" distance="3" position="0 0 0.5" color="#00ffff">
             <a-animation attribute="intensity" from="0.5" to="1.5" dur="1000" repeat="indefinite" direction="alternate"></a-animation>
          </a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');
      const instruction = document.querySelector('.instruction');
      const ghostMesh = document.querySelector('#ghost-mesh');
      const sound = document.querySelector('#ghostSound');

      // Start AR Session on click
      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        uiOverlay.style.display = 'block';
        // Initialize MindAR and Camera
        sceneEl.systems['mindar-image-system'].start(); 
        // Pre-load/Unlock audio
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
        });
      });

      sceneEl.addEventListener("targetFound", event => {
        instruction.innerText = "SPIRIT DETECTED!";
        document.body.classList.add('scanning');
        sound.play().catch(e => console.log("Audio play blocked"));
      });

      sceneEl.addEventListener("targetLost", event => {
        instruction.innerText = "Scanning for spirits...";
        document.body.classList.remove('scanning');
        sound.pause();
      });

      // Tapping the ghost makes it "shiver" and turn angry
      document.querySelector('#ghost-group').addEventListener('click', () => {
        instruction.innerText = "YOU AGGRAVATED IT!";
        
        // Visual reaction: spin and scale up
        ghostMesh.setAttribute('animation__shake', 'property: rotation; to: 0 360 0; dur: 400; easing: easeInOutQuad');
        ghostMesh.setAttribute('animation__scale', 'property: scale; to: 0.8 0.8 0.8; dur: 200; dir: alternate; loop: 2');

        setTimeout(() => {
          ghostMesh.removeAttribute('animation__shake');
          ghostMesh.removeAttribute('animation__scale');
          instruction.innerText = "SPIRIT DETECTED!";
        }, 1000);
      });
    </script>
  </body>
</html>
