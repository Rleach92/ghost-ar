<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- We are using A-Frame for 3D and MindAR for the AR tracking -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #ui-overlay {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 100;
        pointer-events: none;
      }
      .instruction {
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        display: inline-block;
      }
      #scanning-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>

    <!-- Instruction Overlay -->
    <div id="ui-overlay">
      <div class="instruction">Scan the Ghost Target to reveal the spirit...</div>
    </div>

    <!-- 
      MindAR Configuration:
      - imageTargetSrc: This is the compiled tracking data. 
      - For this demo, I am using a sample tracking file provided by MindAR.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- In the future, you can put your .glb ghost model here -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 
        The target image! 
        When the camera sees the target at index 0, the items inside this entity appear.
      -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Let's create a "Ghost" using primitive shapes for now -->
        <a-entity id="ghost-group" position="0 0 0">
          
          <!-- Head/Body -->
          <a-sphere position="0 0.4 0" radius="0.3" color="#ffffff" opacity="0.7" 
                    animation="property: position; to: 0 0.5 0; dir: alternate; dur: 1000; loop: true">
          </a-sphere>
          
          <!-- Eyes -->
          <a-sphere position="-0.1 0.5 0.25" radius="0.05" color="black"></a-sphere>
          <a-sphere position="0.1 0.5 0.25" radius="0.05" color="black"></a-sphere>
          
          <!-- Ethereal Trail -->
          <a-cone position="0 0.1 0" radius-bottom="0.3" radius-top="0" height="0.6" color="#ffffff" opacity="0.4"></a-cone>
          
          <!-- Light effect -->
          <a-light type="point" intensity="0.5" distance="2" position="0 0.5 0" color="#00ffff"></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      // Simple logic to hide the instruction when a target is found
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener("targetFound", event => {
        console.log("Ghost spotted!");
        document.querySelector('.instruction').innerText = "A SPIRIT HAS APPEARED!";
      });

      sceneEl.addEventListener("targetLost", event => {
        document.querySelector('.instruction').innerText = "Scan the Ghost Target...";
      });
    </script>
  </body>
</html>
