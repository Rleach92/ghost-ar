<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- A-Frame and MindAR (Stable Versions) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }
      
      video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important; 
      }

      canvas.a-canvas { z-index: 1 !important; }

      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #0a1a1a 0%, #000 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center; padding: 20px; box-sizing: border-box;
      }

      #start-btn {
        padding: 20px 60px; font-size: 22px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; margin-top: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        text-transform: uppercase; letter-spacing: 2px;
      }

      #scan-guide {
        position: fixed; top: 50%; left: 50%;
        width: 250px; height: 180px;
        border: 2px dashed rgba(255, 255, 255, 0.5);
        transform: translate(-50%, -50%);
        z-index: 10; display: none;
        pointer-events: none;
      }

      #scan-guide::after {
        content: "PLACE IMAGE HERE";
        position: absolute; bottom: -30px; left: 0; width: 100%;
        text-align: center; color: white; font-size: 10px; letter-spacing: 2px;
      }

      #ui-overlay {
        position: absolute; bottom: 40px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none;
      }

      .instruction {
        background: rgba(0,0,0,0.85); color: #00ffff;
        padding: 12px 30px; border-radius: 50px;
        display: inline-block; border: 2px solid rgba(0,255,255,0.4);
        text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
      }

      #debug-log {
        margin-top: 40px; font-size: 11px; color: #4debeb;
        font-family: monospace; max-width: 90%; line-height: 1.6;
        text-align: left; opacity: 0.7; word-break: break-all;
      }

      .error { color: #ff4444 !important; opacity: 1 !important; }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1 style="letter-spacing: 12px; margin-bottom: 5px; color: #00ffff;">GHOST HUNTER</h1>
      <p style="opacity: 0.6; font-size: 14px; letter-spacing: 2px;">SCAN TARGETS TO REVEAL SPIRITS</p>
      <button id="start-btn">BEGIN SCAN</button>
      <div id="debug-log">SYSTEM STATUS: READY</div>
    </div>

    <div id="scan-guide"></div>

    <div id="ui-overlay">
      <div class="instruction">Scanning for Ectoplasm...</div>
    </div>

    <!-- 
      Using a high-reliability global CDN for the .mind file.
      This ensures the file always loads regardless of local folder issues.
    -->
    <a-scene 
      id="main-scene"
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      embedded
      renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="ghost-anchor">
            <a-gltf-model 
              src="#ghostModel" 
              position="0 0 0.1" 
              scale="0.8 0.8 0.8"
              animation="property: position; to: 0 0.3 0.4; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine"
              animation__rotate="property: rotation; to: 0 360 0; dur: 12000; easing: linear; loop: true"
            ></a-gltf-model>

            <a-entity position="0 0 0.1">
              <a-sphere position="0.3 0.2 0.2" radius="0.06" color="#00ffff" opacity="0.25"></a-sphere>
              <a-sphere position="-0.4 0.4 -0.1" radius="0.09" color="#ffffff" opacity="0.15"></a-sphere>
            </a-entity>

            <a-light type="point" intensity="2" distance="5" position="0 0.5 0.5" color="#00ffff"></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const debugLog = document.querySelector('#debug-log');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');
      const guide = document.querySelector('#scan-guide');

      function log(msg, isError = false) {
        const timestamp = new Date().toLocaleTimeString().split(' ')[0];
        debugLog.innerHTML += `<br><span class="${isError ? 'error' : ''}">[${timestamp}] ${msg}</span>`;
      }

      startBtn.addEventListener('click', async () => {
        log("INITIATING SENSORS...");
        startBtn.style.display = 'none';
        
        try {
            log("AUTHORIZING CAMERA...");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            stream.getTracks().forEach(t => t.stop());
            
            log("STREAM READY.");
            bootAR();
        } catch (err) {
            log("CAMERA BLOCKED: " + err.message, true);
            startBtn.style.display = 'block';
        }
      });

      function bootAR() {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) {
            log("STARTING AR ENGINE...");
            sceneEl.play();
            arSystem.start();
            log("SCANNER ACTIVE.");
            
            setTimeout(() => {
                overlay.style.display = 'none';
                uiOverlay.style.display = 'block';
                guide.style.display = 'block';
            }, 1000);
        } else {
            log("SYSTEM ERROR: Component missing.", true);
        }
      }

      sceneEl.addEventListener("arReady", () => {
        log("DATA LOADED. TRACKING ON.");
      });

      sceneEl.addEventListener("arError", (err) => {
        log("TRACKING ERROR: " + err.message, true);
      });

      sceneEl.addEventListener("targetFound", () => {
        log("GHOST MANIFESTED!");
        guide.style.display = 'none';
        const instr = document.querySelector('.instruction');
        instr.innerText = "GHOST DETECTED!";
        instr.style.borderColor = "#ff4444";
        instr.style.color = "#ff4444";
      });

      sceneEl.addEventListener("targetLost", () => {
        guide.style.display = 'block';
        const instr = document.querySelector('.instruction');
        instr.innerText = "Scanning for Ectoplasm...";
        instr.style.borderColor = "#00ffff";
        instr.style.color = "#00ffff";
      });
    </script>
  </body>
</html>
