<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- A-Frame and MindAR (Stable Versions) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <!-- A-Frame Particle System -->
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
      
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center;
      }

      #start-btn {
        padding: 15px 45px; font-size: 22px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; margin-top: 25px;
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        transition: all 0.2s;
      }

      #start-btn:active { transform: scale(0.95); }

      #ui-overlay {
        position: absolute; bottom: 30px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none;
      }

      .instruction {
        background: rgba(0,0,0,0.85); color: #00ffff;
        padding: 12px 30px; border-radius: 50px;
        display: inline-block; border: 1px solid #00ffff;
        text-transform: uppercase; letter-spacing: 2px;
        font-size: 14px;
      }

      #status-msg {
        color: #00ffff; margin-top: 20px; font-size: 14px; 
        font-weight: 300; letter-spacing: 1px;
      }

      .error-msg { color: #ff4444 !important; font-weight: bold !important; }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1 style="letter-spacing: 8px; margin-bottom: 0;">GHOST HUNTER</h1>
      <p style="opacity: 0.6; margin-top: 5px;">AUGMENTED REALITY SCANNER</p>
      <button id="start-btn">INITIALIZE SCAN</button>
      <div id="status-msg">READY TO BEGIN</div>
    </div>

    <div id="ui-overlay">
      <div class="instruction">Scanning for spirits...</div>
    </div>

    <!-- 
      MindAR Image Tracking
      Using 'targets.mind' - ensure this file is in the same folder as index.html
    -->
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
        <audio id="ghostSound" src="https://cdn.pixabay.com/audio/2022/10/30/audio_55a2998782.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="ghost-container" class="clickable">
          
          <a-gltf-model 
            id="ghost-mesh"
            src="#ghostModel" 
            position="0 -0.5 0" 
            scale="0.6 0.6 0.6"
            animation="property: position; to: 0 -0.3 0.1; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine"
          ></a-gltf-model>

          <a-entity position="0 0 0" 
            particle-system="preset: dust; color: #ccffff; particleCount: 400; size: 0.4; velocityValue: 0 0.08 0; opacity: 0.2;">
          </a-entity>

          <a-light type="point" intensity="1.5" distance="4" position="0 0.5 0.5" color="#00ffff">
             <a-animation attribute="intensity" from="0.5" to="2.0" dur="1500" repeat="indefinite" direction="alternate"></a-animation>
          </a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const statusMsg = document.querySelector('#status-msg');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');
      const instruction = document.querySelector('.instruction');
      const ghostMesh = document.querySelector('#ghost-mesh');
      const sound = document.querySelector('#ghostSound');

      startBtn.addEventListener('click', async () => {
        statusMsg.innerText = "REQUESTING CAMERA ACCESS...";
        startBtn.style.display = 'none';
        
        try {
          // Explicitly wait for camera permission before starting AR
          await navigator.mediaDevices.getUserMedia({ video: true });
          
          statusMsg.innerText = "LOADING SPECTRAL DATA...";
          
          // Start the MindAR System
          const arSystem = sceneEl.systems['mindar-image-system'];
          arSystem.start(); 
          
          // Audio unlock for mobile
          sound.play().then(() => { sound.pause(); sound.currentTime = 0; });
          
        } catch (err) {
          console.error("Camera Error:", err);
          statusMsg.innerText = "ERROR: CAMERA PERMISSION DENIED";
          statusMsg.classList.add('error-msg');
        }
      });

      // AR System ready event
      sceneEl.addEventListener("arReady", () => {
        overlay.style.display = 'none';
        uiOverlay.style.display = 'block';
      });

      // AR System error event
      sceneEl.addEventListener("arError", (event) => {
        statusMsg.innerText = "FILE ERROR: COULD NOT LOAD TARGETS.MIND";
        statusMsg.classList.add('error-msg');
        console.error("AR Error:", event);
      });

      sceneEl.addEventListener("targetFound", event => {
        instruction.innerText = "SIGHTING CONFIRMED!";
        instruction.style.color = "#ff4444";
        sound.play();
      });

      sceneEl.addEventListener("targetLost", event => {
        instruction.innerText = "Scanning for spirits...";
        instruction.style.color = "#00ffff";
        sound.pause();
      });

      document.querySelector('#ghost-container').addEventListener('click', () => {
        instruction.innerText = "THE SPIRIT IS AGITATED!";
        ghostMesh.setAttribute('animation__shake', 'property: rotation; to: 0 360 0; dur: 400; easing: easeInOutQuad');
        setTimeout(() => {
          ghostMesh.removeAttribute('animation__shake');
          instruction.innerText = "SIGHTING CONFIRMED!";
        }, 1000);
      });
    </script>
  </body>
</html>
