<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- A-Frame and MindAR (Stable Versions) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }
      
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #0a1a1a 0%, #000 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center; padding: 20px; box-sizing: border-box;
      }

      #start-btn {
        padding: 20px 60px; font-size: 22px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; margin-top: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        text-transform: uppercase; letter-spacing: 2px;
      }

      #ui-overlay {
        position: absolute; bottom: 40px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none;
      }

      .instruction {
        background: rgba(0,0,0,0.85); color: #00ffff;
        padding: 12px 30px; border-radius: 50px;
        display: inline-block; border: 1px solid rgba(0,255,255,0.4);
        text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
      }

      #debug-log {
        margin-top: 40px; font-size: 11px; color: #4debeb;
        font-family: monospace; max-width: 90%; line-height: 1.6;
        text-align: left; opacity: 0.7;
      }

      .error { color: #ff4444 !important; opacity: 1 !important; }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1 style="letter-spacing: 12px; margin-bottom: 5px; color: #00ffff;">GHOST HUNTER</h1>
      <p style="opacity: 0.6; font-size: 14px; letter-spacing: 2px;">SCAN TARGETS TO REVEAL SPIRITS</p>
      
      <button id="start-btn">BEGIN SCAN</button>
      
      <div id="debug-log">SYSTEM STATUS: READY</div>
    </div>

    <div id="ui-overlay">
      <div class="instruction">Scanning for Ectoplasm...</div>
    </div>

    <a-scene 
      id="main-scene"
      mindar-image="autoStart: false; uiLoading: yes; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="ghost-anchor">
            <a-gltf-model 
              id="ghost-mesh"
              src="#ghostModel" 
              position="0 -0.4 0" 
              scale="0.6 0.6 0.6"
              animation="property: position; to: 0 -0.2 0.1; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
            ></a-gltf-model>

            <!-- Mist Effect using spheres for stability -->
            <a-entity id="mist-cloud" position="0 0 0" animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
              <a-sphere position="0.4 0.1 0.2" radius="0.05" color="#00ffff" opacity="0.3"
                animation="property: position; to: 0.4 0.3 0.2; dir: alternate; dur: 2500; loop: true"></a-sphere>
              <a-sphere position="-0.3 0.5 -0.1" radius="0.08" color="#ffffff" opacity="0.2"
                animation="property: position; to: -0.3 0.2 -0.1; dir: alternate; dur: 3000; loop: true"></a-sphere>
              <a-sphere position="0.1 -0.2 0.4" radius="0.04" color="#00ffff" opacity="0.4"
                animation="property: position; to: 0.1 0.1 0.4; dur: 1800; loop: true"></a-sphere>
            </a-entity>

            <a-light type="point" intensity="1.5" distance="4" position="0 0.5 0.5" color="#00ffff">
                 <a-animation attribute="intensity" from="0.5" to="2.0" dur="1500" repeat="indefinite" direction="alternate"></a-animation>
            </a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const debugLog = document.querySelector('#debug-log');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');

      function log(msg, isError = false) {
        const timestamp = new Date().toLocaleTimeString().split(' ')[0];
        debugLog.innerHTML += `<br><span class="${isError ? 'error' : ''}">[${timestamp}] ${msg}</span>`;
        console.log(`[${timestamp}] ${msg}`);
      }

      startBtn.addEventListener('click', () => {
        log("USER GESTURE RECEIVED");
        startBtn.style.display = 'none';
        
        // Construct the absolute path to targets.mind more robustly
        let targetsPath = "targets.mind";
        try {
            const url = new URL('targets.mind', window.location.href);
            targetsPath = url.href;
            log("RESOLVED PATH: " + targetsPath);
        } catch (e) {
            log("PATH WARNING: Using literal string", true);
        }

        // Set attributes and boot AR
        sceneEl.setAttribute('mindar-image', `imageTargetSrc: ${targetsPath}; autoStart: false; uiLoading: yes; uiScanning: no;`);
        
        if (sceneEl.hasLoaded) {
            bootAR();
        } else {
            sceneEl.addEventListener('loaded', bootAR);
        }
      });

      function bootAR() {
        log("REQUESTING CAMERA...");
        
        // Small delay to ensure attributes have been parsed by MindAR component
        setTimeout(() => {
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) {
                try {
                    arSystem.start();
                    log("SCANNER ACTIVE.");
                } catch (err) {
                    log("HARDWARE ERROR: " + err.message, true);
                    console.error(err);
                }
            } else {
                log("CORE COMPONENT MISSING", true);
            }
        }, 100);
      }

      sceneEl.addEventListener("arReady", () => {
        log("CONNECTED TO CAMERA.");
        overlay.style.display = 'none';
        uiOverlay.style.display = 'block';
      });

      sceneEl.addEventListener("arError", (err) => {
        log("FETCH FAILED: Check targets.mind file availability", true);
        console.error("MindAR Error:", err);
      });

      sceneEl.addEventListener("targetFound", () => {
        document.querySelector('.instruction').innerText = "GHOST DETECTED!";
      });

      sceneEl.addEventListener("targetLost", () => {
        document.querySelector('.instruction').innerText = "Scanning for Ectoplasm...";
      });
    </script>
  </body>
</html>
