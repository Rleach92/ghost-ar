<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }
      
      video {
        position: fixed !important; top: 0 !important; left: 0 !important;
        width: 100vw !important; height: 100vh !important;
        object-fit: cover !important; z-index: 0 !important; 
      }

      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #0a1a1a 0%, #000 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center; padding: 20px;
      }

      #start-btn {
        padding: 20px 60px; font-size: 22px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; margin-top: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        text-transform: uppercase; letter-spacing: 2px;
      }

      #scan-guide {
        position: fixed; top: 50%; left: 50%;
        width: 280px; height: 190px;
        border: 2px dashed #00ffff;
        transform: translate(-50%, -50%);
        z-index: 10; display: none; pointer-events: none;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      }

      #ui-overlay {
        position: absolute; bottom: 40px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none;
      }

      .instruction {
        background: rgba(0,0,0,0.85); color: #00ffff;
        padding: 12px 30px; border-radius: 50px;
        display: inline-block; border: 2px solid rgba(0,255,255,0.4);
        text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
        transition: all 0.3s ease;
      }

      #debug-log {
        margin-top: 40px; font-size: 10px; color: #4debeb;
        opacity: 0.5; font-family: monospace; text-align: left;
        max-width: 80%;
      }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1 style="letter-spacing: 12px; color: #00ffff;">GHOST HUNTER</h1>
      <p style="opacity: 0.6; letter-spacing: 2px;">CALIBRATING SPECTRAL LENS</p>
      <button id="start-btn">BEGIN SCAN</button>
      <div id="debug-log">SYSTEM STATUS: READY</div>
    </div>

    <div id="scan-guide"></div>

    <div id="ui-overlay">
      <div class="instruction" id="status-text">Searching for Ectoplasm...</div>
    </div>

    <!-- 
      MindAR Optimization:
      Lowering filterMinCF to 0.0001 makes the "handshake" between the camera and the image much faster.
      Increasing missTolerance ensures the ghost doesn't vanish instantly if the camera shakes.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 15; missTolerance: 30;" 
      embedded color-space="sRGB" renderer="colorManagement: true, alpha: true" 
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="#ghostModel" 
          position="0 0 0.3" 
          scale="1.5 1.5 1.5"
          animation="property: position; to: 0 0.4 0.6; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
          animation__rotate="property: rotation; to: 0 360 0; dur: 12000; easing: linear; loop: true"
        ></a-gltf-model>
        <a-light type="point" intensity="2" position="0 0.5 0.5" color="#00ffff"></a-light>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const debugLog = document.querySelector('#debug-log');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');
      const guide = document.querySelector('#scan-guide');
      const statusText = document.querySelector('#status-text');

      function log(msg) {
        debugLog.innerHTML += `<br>> ${msg}`;
      }

      startBtn.addEventListener('click', async () => {
        log("PREPARING LENS...");
        startBtn.style.display = 'none';
        try {
            // First satisfy the browser's direct camera request
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            stream.getTracks().forEach(t => t.stop());
            
            // Kickstart MindAR
            const arSystem = sceneEl.systems['mindar-image-system'];
            sceneEl.play();
            arSystem.start();
            log("SCANNER LIVE.");
            
            setTimeout(() => {
                overlay.style.display = 'none';
                uiOverlay.style.display = 'block';
                guide.style.display = 'block';
            }, 1000);
        } catch (err) {
            log("ERROR: " + err.name);
            startBtn.style.display = 'block';
        }
      });

      sceneEl.addEventListener("targetFound", () => {
        log("GHOST DETECTED!");
        guide.style.display = 'none';
        statusText.innerText = "GHOST DETECTED!";
        statusText.style.color = "#ff4444";
        statusText.style.borderColor = "#ff4444";
        statusText.style.boxShadow = "0 0 20px #ff4444";
      });

      sceneEl.addEventListener("targetLost", () => {
        log("SIGNAL LOST.");
        guide.style.display = 'block';
        statusText.innerText = "Searching for Ectoplasm...";
        statusText.style.color = "#00ffff";
        statusText.style.borderColor = "rgba(0,255,255,0.4)";
        statusText.style.boxShadow = "none";
      });
    </script>
  </body>
</html>
