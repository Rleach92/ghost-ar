<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- We are using A-Frame for 3D and MindAR for the AR tracking -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #ui-overlay {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        z-index: 100;
        pointer-events: none;
      }
      .instruction {
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 25px;
        display: inline-block;
        transition: all 0.3s ease;
      }
      /* Custom styles for the scanning UI */
      .scanning .instruction {
        border: 2px solid #00ffff;
        box-shadow: 0 0 15px #00ffff;
      }
    </style>
  </head>
  <body>

    <!-- Instruction Overlay -->
    <div id="ui-overlay">
      <div class="instruction">Scan your custom target to reveal the spirit...</div>
    </div>

    <!-- 
      A-Scene Configuration
      - imageTargetSrc updated to use an absolute URL to resolve fetch errors in certain environments.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Spooky Sound Asset -->
        <audio id="ghostSound" src="https://cdn.pixabay.com/audio/2022/10/30/audio_55a2998782.mp3" preload="auto"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false">
        <!-- The cursor allows us to "click" or "tap" things in AR -->
        <a-cursor fuse="false" raycaster="objects: .clickable"></a-cursor>
      </a-camera>

      <!-- Target Index 0 -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-entity id="ghost-group" position="0 0 0" class="clickable">
          
          <!-- Spooky Floating Body -->
          <a-sphere id="ghost-body" 
                    position="0 0.4 0" radius="0.3" color="#ffffff" opacity="0.6" 
                    animation="property: position; to: 0 0.6 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">
          </a-sphere>
          
          <!-- Eyes -->
          <a-sphere position="-0.1 0.5 0.25" radius="0.04" color="black"></a-sphere>
          <a-sphere position="0.1 0.5 0.25" radius="0.04" color="black"></a-sphere>
          
          <!-- Ethereal Trail -->
          <a-cone position="0 0.1 0" radius-bottom="0.3" radius-top="0" height="0.7" color="#ffffff" opacity="0.3"></a-cone>
          
          <!-- Spooky Glow -->
          <a-light type="point" intensity="0.8" distance="2" position="0 0.5 0" color="#afffff"></a-light>
        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const instruction = document.querySelector('.instruction');
      const ghostGroup = document.querySelector('#ghost-group');
      const ghostBody = document.querySelector('#ghost-body');
      const sound = document.querySelector('#ghostSound');

      // 1. Detection Logic
      sceneEl.addEventListener("targetFound", event => {
        instruction.innerText = "SIGHTING CONFIRMED!";
        instruction.style.background = "rgba(0, 150, 0, 0.8)";
        document.body.classList.add('scanning');
        
        // Play spooky sound
        sound.play().catch(e => console.log("Sound waiting for user interaction"));
      });

      sceneEl.addEventListener("targetLost", event => {
        instruction.innerText = "Scan your target to find the ghost...";
        instruction.style.background = "rgba(0, 0, 0, 0.7)";
        document.body.classList.remove('scanning');
        sound.pause();
        sound.currentTime = 0;
      });

      // 2. Interaction Logic (Tapping the ghost)
      ghostGroup.addEventListener('click', () => {
        console.log("Ghost Tapped!");
        
        // Change color to red and spin rapidly
        ghostBody.setAttribute('color', '#ff4444');
        ghostGroup.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 500; easing: easeInOutQuad');
        
        instruction.innerText = "IT SAW YOU!";
        
        // Reset after 1 second
        setTimeout(() => {
          ghostBody.setAttribute('color', '#ffffff');
          ghostGroup.removeAttribute('animation');
          instruction.innerText = "SIGHTING CONFIRMED!";
        }, 1000);
      });

      // Fix for relative URL issues in some preview environments
      window.addEventListener('load', () => {
        const scene = document.querySelector('a-scene');
        const currentSrc = scene.getAttribute('mindar-image');
        // If the path needs to be absolute, we ensure it's handled properly by the browser's base URL logic
        console.log("AR Scene Loaded with target config:", currentSrc);
      });
    </script>
  </body>
</html>
