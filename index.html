<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hunter AR</title>
    <!-- A-Frame and MindAR (Stable Versions) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #000; }
      
      video {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        z-index: 0 !important; 
      }

      canvas.a-canvas { z-index: 1 !important; }

      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #0a1a1a 0%, #000 100%);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 200; color: white; text-align: center; padding: 20px; box-sizing: border-box;
      }

      #start-btn {
        padding: 20px 60px; font-size: 22px; cursor: pointer;
        background: #00ffff; border: none; border-radius: 50px;
        color: black; font-weight: bold; margin-top: 25px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        text-transform: uppercase; letter-spacing: 2px;
      }

      #scan-guide {
        position: fixed; top: 50%; left: 50%;
        width: 280px; height: 200px;
        border: 2px dashed rgba(0, 255, 255, 0.5);
        transform: translate(-50%, -50%);
        z-index: 10; display: none;
        pointer-events: none;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
      }

      #ui-overlay {
        position: absolute; bottom: 40px; left: 0; right: 0;
        text-align: center; z-index: 100; pointer-events: none;
        display: none;
      }

      .instruction {
        background: rgba(0,0,0,0.85); color: #00ffff;
        padding: 12px 30px; border-radius: 50px;
        display: inline-block; border: 2px solid rgba(0,255,255,0.4);
        text-transform: uppercase; letter-spacing: 2px; font-size: 12px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
      }

      #debug-log {
        margin-top: 40px; font-size: 10px; color: #4debeb;
        font-family: monospace; max-width: 90%; line-height: 1.4;
        text-align: left; opacity: 0.5; word-break: break-all;
      }
    </style>
  </head>
  <body>

    <div id="overlay">
      <h1 style="letter-spacing: 12px; margin-bottom: 5px; color: #00ffff;">GHOST HUNTER</h1>
      <p style="opacity: 0.6; font-size: 12px; letter-spacing: 2px;">SYNCING SPECTRAL FREQUENCY</p>
      <button id="start-btn">ENGAGE SCANNER</button>
      <div id="debug-log">LOG: READY</div>
    </div>

    <div id="scan-guide"></div>

    <div id="ui-overlay">
      <div class="instruction">Searching for Ectoplasm...</div>
    </div>

    <!-- 
      MindAR Optimization:
      We use a lower filterMinCF (0.0001) for much faster detection.
      The .mind file used here is the standard MindAR 'card' target which matches your CSS Calibration Target.
    -->
    <a-scene 
      id="main-scene"
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 20;" 
      color-space="sRGB" 
      embedded
      renderer="colorManagement: true, physicallyCorrectLights, alpha: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="ghostModel" src="https://vazxmixjsiawhamofvyt.supabase.co/storage/v1/object/public/models/ghost/model.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity id="ghost-anchor">
            <!-- The Ghost -->
            <a-gltf-model 
              src="#ghostModel" 
              position="0 0 0.2" 
              scale="1 1 1"
              animation="property: position; to: 0 0.4 0.6; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
              animation__rotate="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"
            ></a-gltf-model>

            <!-- Glow -->
            <a-light type="point" intensity="2" distance="10" position="0 0.5 0.5" color="#00ffff"></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector('#start-btn');
      const debugLog = document.querySelector('#debug-log');
      const overlay = document.querySelector('#overlay');
      const uiOverlay = document.querySelector('#ui-overlay');
      const guide = document.querySelector('#scan-guide');

      function log(msg) {
        const time = new Date().toLocaleTimeString().split(' ')[0];
        debugLog.innerHTML += `<br>[${time}] ${msg}`;
        console.log(msg);
      }

      startBtn.addEventListener('click', async () => {
        log("WAKING SENSORS...");
        startBtn.style.display = 'none';
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            stream.getTracks().forEach(t => t.stop());
            log("CAMERA OK.");
            bootAR();
        } catch (err) {
            log("CAMERA ERROR: " + err.name);
            startBtn.style.display = 'block';
        }
      });

      function bootAR() {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (arSystem) {
            log("BOOTING TRACKER...");
            sceneEl.play();
            arSystem.start();
            
            setTimeout(() => {
                overlay.style.display = 'none';
                uiOverlay.style.display = 'block';
                guide.style.display = 'block';
                log("TRACKER LIVE.");
            }, 1000);
        }
      }

      sceneEl.addEventListener("arReady", () => {
        log("SIGNAL LOCKED. START SCAN.");
      });

      sceneEl.addEventListener("targetFound", () => {
        log("MANIFESTATION SUCCESS!");
        guide.style.display = 'none';
        document.querySelector('.instruction').innerText = "GHOST DETECTED!";
        document.querySelector('.instruction').style.color = "#ff4444";
      });

      sceneEl.addEventListener("targetLost", () => {
        guide.style.display = 'block';
        document.querySelector('.instruction').innerText = "Searching for Ectoplasm...";
        document.querySelector('.instruction').style.color = "#00ffff";
      });
    </script>
  </body>
</html>
